# this is a keyd version that works on ubunto.
# sudo nano /etc/keyd/default.conf
# paste script
# sudo systemctl restart keyd




[ids]
*

[main]
capslock = layer(nav)
leftmeta+left = home
leftmeta+right = end

[nav]
# F-keys
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
- = f11
= = f12

# Arrows
j = left
l = right
i = up
k = down

# Home / End
h = home
n = end

# Volume
d = volumeup
s = volumedown
f = mute
